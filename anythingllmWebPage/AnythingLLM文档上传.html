<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnythingLLM 文档上传</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='4' fill='%231d4ed8'/%3E%3Cpath d='M7 12h10M12 7v10' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --text:#1a1d21; --sub:#66707c; --accent:#1d4ed8; --ok:#15803d; --err:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  .sub { color:var(--sub); font-size:13px; margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .field input, .field select { width:100%; padding:9px 10px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text); }
  .field input:focus, .field select:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent); }
  .hint { font-size:12px; color:var(--sub); margin-top:6px; }
  .btn { display:block; width:100%; padding:11px; font-size:15px; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  .btn:disabled { background:#9db4e8; cursor:not-allowed; }
  .result { margin-top:16px; display:none; }
  .result.show { display:block; }
  .item { border:1px solid var(--line); border-left-width:4px; border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px; background:#fff; word-break:break-all; }
  .item.ok { border-left-color:var(--ok); }
  .item.fail { border-left-color:var(--err); }
  .item .name { font-weight:600; }
  .item .msg { color:var(--sub); margin-top:2px; }
  .bar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin:12px 0; display:none; }
  .bar span { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .bar.show { display:block; }
  #fileInput { padding:8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AnythingLLM 文档上传</h1>
  <p class="sub">上传文档到指定工作区，服务端将自动完成分块与向量化嵌入</p>
  <div class="card">
    <div class="field">
      <label for="server">服务地址</label>
      <input id="server" value="http://localhost:3001" placeholder="http://localhost:3001">
    </div>
    <div class="field">
      <label for="apiKey">API Key</label>
      <input id="apiKey" value="4X4HM24-25EMJFH-GPC361N-NC7ES1D">
    </div>
    <div class="field">
      <label for="workspace">目标工作区</label>
      <select id="workspace"><option value="">加载中…</option></select>
      <div class="hint">打开页面时自动读取工作区列表并默认选中第一个</div>
    </div>
    <div class="field">
      <label for="fileInput">选择文档（可多选）</label>
      <input id="fileInput" type="file" multiple>
    </div>
    <div class="bar" id="bar"><span id="barFill"></span></div>
    <button class="btn" id="uploadBtn">上传并嵌入</button>
  </div>
  <div class="result" id="result"></div>
</div>
<script>
  var serverEl = document.getElementById('server');
  var keyEl = document.getElementById('apiKey');
  var wsEl = document.getElementById('workspace');
  var fileEl = document.getElementById('fileInput');
  var btn = document.getElementById('uploadBtn');
  var result = document.getElementById('result');
  var bar = document.getElementById('bar');
  var barFill = document.getElementById('barFill');

  function baseUrl() {
    return serverEl.value.trim().replace(/\/+$/, '');
  }
  function authHeaders() {
    return { 'Authorization': 'Bearer ' + keyEl.value.trim() };
  }

  function loadWorkspaces() {
    wsEl.innerHTML = '<option value="">加载中…</option>';
    fetch(baseUrl() + '/api/v1/workspaces', { headers: authHeaders() })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var list = data.workspaces || [];
        if (!list.length) { wsEl.innerHTML = '<option value="">未找到工作区</option>'; return; }
        wsEl.innerHTML = list.map(function (w) {
          return '<option value="' + w.id + '">' + w.name + '</option>';
        }).join('');
      })
      .catch(function (e) { wsEl.innerHTML = '<option value="">加载失败，请检查地址/Key</option>'; });
  }

  function addItem(name, ok, msg) {
    var div = document.createElement('div');
    div.className = 'item ' + (ok ? 'ok' : 'fail');
    div.innerHTML = '<div class="name">' + name + '</div><div class="msg">' + msg + '</div>';
    result.appendChild(div);
  }

  function uploadOne(file) {
    var fd = new FormData();
    fd.append('file', file);
    fd.append('workspace_id', wsEl.value);
    return fetch(baseUrl() + '/api/v1/document/upload', { method: 'POST', headers: authHeaders(), body: fd })
      .then(function (r) {
        return r.json().then(function (data) { return { status: r.status, data: data }; });
      })
      .then(function (res) {
        if (res.status === 200 && res.data.success) {
          var docs = res.data.documents || [];
          var t = docs.length ? '已上传并嵌入，docId: ' + docs[0].id : '上传成功';
          addItem(file.name, true, t);
        } else {
          addItem(file.name, false, 'HTTP ' + res.status + ' ' + (res.data.error || '未知错误'));
        }
      })
      .catch(function (e) { addItem(file.name, false, '请求失败: ' + e.message); });
  }

  btn.addEventListener('click', function () {
    var files = fileEl.files;
    if (!files.length) { alert('请先选择文件'); return; }
    if (!wsEl.value) { alert('请先确认工作区'); return; }
    result.innerHTML = '';
    result.classList.add('show');
    bar.classList.add('show');
    btn.disabled = true;
    var total = files.length, done = 0;
    var chain = Promise.resolve();
    Array.prototype.forEach.call(files, function (f) {
      chain = chain.then(function () { return uploadOne(f); })
        .then(function () {
          done++;
          barFill.style.width = Math.round(done / total * 100) + '%';
        });
    });
    chain.finally(function () {
      btn.disabled = false;
      bar.classList.remove('show');
    });
  });

  serverEl.addEventListener('change', loadWorkspaces);
  loadWorkspaces();
</script>
</body>
</html>
